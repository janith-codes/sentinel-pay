server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: sentinel-pay-api

  # ====================== DATABASE (PostgreSQL) ======================
  datasource:
    url: jdbc:postgresql://localhost:5433/sentinelpay
    username: sentinel
    password: sentinel123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000

  # ====================== JPA / Hibernate ======================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ====================== FLYWAY (Database Migrations) ======================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  # ====================== REDIS ======================
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

  # ====================== RABBITMQ ======================
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # ====================== SPRING AI (OpenAI) ======================
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-your-openai-key-here}   # Change this or set environment variable

  # ====================== ACTUATOR / OBSERVABILITY ======================
  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus
    endpoint:
      health:
        show-details: always
    metrics:
      export:
        prometheus:
          enabled: true

# ====================== LOGGING ======================
logging:
  level:
    com.sentinelpay: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: DEBUG