server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: sentinel-pay-api
  profiles:
    include: local
  threads:
    virtual:
      enabled: true

  # ====================== DATABASE (PostgreSQL) ======================
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:sentinelpay}
    username: ${DB_USERNAME:sentinel}
    password: ${DB_PASSWORD:sentinel123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000

  # ====================== JPA / Hibernate ======================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ====================== FLYWAY (Database Migrations) ======================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  # ====================== REDIS ======================
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

  # ====================== RABBITMQ ======================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # ====================== SPRING AI (OpenAI) ======================
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-your-openai-key-here}

# ====================== SECURITY (JWT) ======================
# JWT_SECRET must be overridden in every non-local environment.
sentinelpay:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    expiration: ${JWT_EXPIRATION:900000}
    issuer: sentinel-pay

# ====================== ACTUATOR / OBSERVABILITY ======================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# ====================== LOGGING ======================
logging:
  level:
    com.sentinelpay: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: DEBUG