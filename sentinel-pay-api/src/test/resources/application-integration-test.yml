# Integration-test profile. Connection details for PostgreSQL, Redis and RabbitMQ are supplied at
# runtime by Testcontainers through @DynamicPropertySource, so none appear here.
spring:
  jpa:
    show-sql: false
    hibernate:
      # Validated against the Flyway-managed schema: startup fails if entity mappings drift.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    openai:
      api-key: integration-test-key-not-real
      # Deliberately unreachable: every evaluation falls through to the rule-based fraud logic.
      base-url: http://localhost:1
    retry:
      # Without this, Spring AI retries the unreachable endpoint with exponential backoff.
      max-attempts: 1

sentinelpay:
  jwt:
    secret: integration-test-jwt-secret-0123456789abcdef
    expiration: 900000
    issuer: sentinel-pay

logging:
  level:
    com.sentinelpay: INFO
    org.hibernate.SQL: WARN
    org.testcontainers: INFO
    com.github.dockerjava: WARN
