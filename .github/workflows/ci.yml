name: CI

"on":
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Maven Wrapper
        run: |
          chmod +x mvnw
          ./mvnw -B -v

      - name: Run Maven verify
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t sentinel-pay:ci .
